name: Corporate Investment Structural Selection Readiness

on:
  pull_request:
    paths:
      - "model/calibration_validation/corporate_investment_structural_selection_contract.json"
      - "src/romania_macro_financial_dynamics/corporate_investment_selection.py"
      - "scripts/run_corporate_investment_structural_selection.py"
      - "tests/test_corporate_investment_structural_selection_contract.py"
      - "tests/test_corporate_investment_selection_logic.py"
      - "tests/test_corporate_investment_selection_runner.py"
      - ".github/workflows/corporate-investment-structural-selection.yml"

permissions:
  contents: read

jobs:
  verify-selection-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify frozen contract and primitives
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests.test_corporate_investment_structural_selection_contract -v
          python -m unittest tests.test_corporate_investment_selection_logic -v
          python -m unittest tests.test_corporate_investment_selection_runner -v
      - name: Verify default runner performs no estimation
        env:
          PYTHONPATH: src
        run: python scripts/run_corporate_investment_structural_selection.py
