name: Corporate Investment Offline Measurement Panel

on:
  pull_request:
    paths:
      - "model/calibration_validation/corporate_investment_measurement_panel_contract.json"
      - "model/calibration_validation/corporate_investment_measurement_design_contract.json"
      - "scripts/audit_corporate_investment_measurement_panel.py"
      - "tests/test_corporate_investment_measurement_panel_contract.py"
      - "tests/test_corporate_investment_measurement_panel_logic.py"
      - "data/source_vintages/corporate-investment-source-family-vintage-2026-09-19/**"
      - "data/source_vintages/corporate-investment-supplemental-source-vintage-2026-09-19/**"
      - ".github/workflows/corporate-investment-measurement-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline-measurement-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen measurement contracts and logic
        run: |
          python -m unittest tests.test_corporate_investment_measurement_panel_contract -v
          python -m unittest tests.test_corporate_investment_measurement_panel_logic -v

      - name: Build deterministic offline measurement panel
        env:
          CORPORATE_INVESTMENT_MEASUREMENT_OUT: corporate_investment_measurement_artifacts
        run: python scripts/audit_corporate_investment_measurement_panel.py

      - name: Upload offline measurement evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corporate-investment-measurement-panel-${{ github.sha }}
          path: corporate_investment_measurement_artifacts/
          if-no-files-found: error
          retention-days: 90
