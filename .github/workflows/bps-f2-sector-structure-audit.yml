name: BPS F2 Sector Structure Audit

# Live provider refresh is manual-only under the terminal Accounting Spine hold.
# Unchanged reruns are reproduction only and do not satisfy a reopen trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-bps-f2-sector-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify BPS sector-structure contract
        run: python -m unittest tests.test_bps_f2_sector_structure_contract -v

      - name: Probe BPS F2 sector structure
        env:
          BPS_F2_AUDIT_OUT: bps_f2_audit_artifacts
        run: python scripts/audit_bps_f2_sector_structure.py

      - name: Upload BPS source-structure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bps-f2-sector-structure-${{ github.sha }}
          path: bps_f2_audit_artifacts/
          if-no-files-found: error
          retention-days: 30
