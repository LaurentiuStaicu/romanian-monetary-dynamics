name: Eurostat F2 Detailed Sector Audit

# Live provider refresh is manual-only under the terminal Accounting Spine hold.
# Unchanged reruns are reproduction only and do not satisfy a reopen trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-eurostat-f2-sector-detail:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify Eurostat detailed-sector contract
        run: python -m unittest tests.test_eurostat_f2_sector_detail_contract -v

      - name: Probe Eurostat bop_iip6_q detailed F2 sectors
        env:
          EUROSTAT_F2_AUDIT_OUT: eurostat_f2_audit_artifacts
        run: python scripts/audit_eurostat_bop_iip6_q_f2_sector_detail.py

      - name: Upload Eurostat sector-detail evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eurostat-f2-sector-detail-${{ github.sha }}
          path: eurostat_f2_audit_artifacts/
          if-no-files-found: error
          retention-days: 30
