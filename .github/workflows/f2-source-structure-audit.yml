name: F2 Source Structure Audit

# Live ECB QSA source-structure refresh is manual-only.
# The original Phase A0 evidence is retained; unchanged provider reruns are
# reproduction only and do not satisfy the closed F2 reopen gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-f2-qsa-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile probe
        run: python -m py_compile scripts/probe_qsa_f2_structure.py

      - name: Probe official ECB QSA F2 publication structure
        env:
          F2_PROBE_OUT: f2_probe_artifacts
        run: python scripts/probe_qsa_f2_structure.py --allow-live-refetch

      - name: Upload raw source responses and structure report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f2-source-structure-${{ github.sha }}
          path: f2_probe_artifacts/
          if-no-files-found: error
          retention-days: 30
