name: Government Debt Stock Reference Audit

# Live-source refresh is intentionally manual. The canonical scientific state is
# reproduced offline from retained snapshots/assessments in Scientific CI.
# A transient provider/network failure must not rewrite a validated vintage.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-government-debt-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify government-debt reference contract
        run: python -m unittest tests.test_government_debt_stock_reference_contract -v

      - name: Probe Eurostat GD reference series
        env:
          GOV_DEBT_REFERENCE_AUDIT_OUT: government_debt_reference_audit_artifacts
        run: python scripts/audit_eurostat_government_debt_stock_reference.py

      - name: Upload government-debt reference evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: government-debt-stock-reference-${{ github.sha }}
          path: government_debt_reference_audit_artifacts/
          if-no-files-found: error
          retention-days: 90
