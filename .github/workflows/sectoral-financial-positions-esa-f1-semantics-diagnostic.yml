name: Sectoral Financial Positions ESA F1 Semantics Diagnostic

# Archived exploratory live refresh/diagnostic only. The executed source evidence
# is already retained; reruns are manual-only and cannot change reference-mode
# readiness, historical A-D, Accounting Spine readiness, or behavioural closure.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exploratory-esa-f1-semantics-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Re-run archived F1 F11 F12 semantics diagnostic
        env:
          SECTORAL_POSITIONS_ESA_F1_SEMANTICS_OUT: sectoral_positions_esa_f1_semantics_artifacts
        run: python scripts/audit_ecb_sectoral_financial_positions_esa_f1_semantics_diagnostic.py

      - name: Upload exploratory semantics evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sectoral-financial-positions-esa-f1-semantics-${{ github.sha }}
          path: sectoral_positions_esa_f1_semantics_artifacts/
          if-no-files-found: error
          retention-days: 90
