name: FX HICP Current Source Structure Probe

# Manual-only refresh of the current ECOICOP-v2 HICP structure.
# The retained 2026-09-19 vintage already freezes I25/TOTAL/RO.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-current-hicp-source-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Probe current Eurostat Romania HICP ECOICOP-v2 structure
        env:
          FX_HICP_CURRENT_PROBE_OUT: fx_hicp_current_probe_artifacts
        run: python scripts/audit_fx_hicp_current_source_structure.py
      - name: Upload current HICP structure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fx-hicp-current-structure-probe-${{ github.sha }}
          path: fx_hicp_current_probe_artifacts/
          if-no-files-found: error
          retention-days: 90
