name: Corporate Investment Selection Gate Integrity

on:
  pull_request:
    paths:
      - "model/calibration_validation/corporate_investment_selection_execution_gate.json"
      - "model/calibration_validation/corporate_investment_structural_selection_result.json"
      - "model/calibration_validation/corporate_investment_structural_selection_promotion_review.json"
      - "scripts/run_corporate_investment_structural_selection.py"
      - "tests/test_corporate_investment_selection_runner.py"
      - "tests/test_corporate_investment_structural_selection_promotion_review.py"
      - ".github/workflows/corporate-investment-selection-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-consumed-selection-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify consumed gate and frozen failed result
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests.test_corporate_investment_selection_runner -v
          python -m unittest tests.test_corporate_investment_structural_selection_promotion_review -v

      - name: Verify default runner performs no estimation
        env:
          PYTHONPATH: src
        run: python scripts/run_corporate_investment_structural_selection.py
