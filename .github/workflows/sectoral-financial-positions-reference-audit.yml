name: Sectoral Financial Positions Reference Audit


# Phase A live QSA source refresh is intentionally manual after the retained
# immutable run. Canonical scientific state is reproduced offline from the
# retained assessment/artifact identity and invariant tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-sectoral-financial-positions-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify preregistered sectoral-position reference contract
        run: python -m unittest tests.test_sectoral_financial_positions_reference_contract -v

      - name: Probe exact ECB QSA F2-F8 aggregate sectoral boundary
        env:
          SECTORAL_POSITIONS_REFERENCE_AUDIT_OUT: sectoral_positions_reference_audit_artifacts
        run: python scripts/audit_ecb_sectoral_financial_positions_reference.py

      - name: Upload sectoral-position source-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sectoral-financial-positions-reference-${{ github.sha }}
          path: sectoral_positions_reference_audit_artifacts/
          if-no-files-found: error
          retention-days: 90
