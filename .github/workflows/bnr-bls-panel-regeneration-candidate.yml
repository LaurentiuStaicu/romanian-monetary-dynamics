name: BNR BLS Panel Regeneration Candidate

on:
  pull_request:
    paths:
      - "model/calibration_validation/bnr_bls_panel_regeneration_candidate_contract.json"
      - "model/calibration_validation/bnr_bls_canonical_panel_promotion_review.json"
      - "model/calibration_validation/bnr_bls_cross_round_mapping_audit.json"
      - "data/processed/bnr_bls_realised_rounds.csv"
      - "tests/test_bnr_bls_panel_regeneration_candidate_contract.py"
      - "tests/test_bnr_bls_canonical_panel_promotion_review.py"
      - ".github/workflows/bnr-bls-panel-regeneration-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical-candidate-and-canonical-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen historical candidate contract
        run: python -m unittest tests.test_bnr_bls_panel_regeneration_candidate_contract -v

      - name: Verify exact reviewed candidate was canonically promoted
        run: python -m unittest tests.test_bnr_bls_canonical_panel_promotion_review -v

      - name: Verify current canonical cross-round result
        run: python -m unittest tests.test_bnr_bls_cross_round_mapping_result -v
