name: Promote Recovered Ministry 2025 Official PDFs

on:
  push:
    branches:
      - recovery/mof-announced-ron-primary-reference-auction-missing-sources-2026-09-20
    paths:
      - .github/workflows/mof-announced-ron-primary-reference-auction-recovered-official-pdfs.yml
      - scripts/promote_mof_announced_RON_primary_reference_auction_recovered_official_pdfs.py
      - scripts/probe_mof_announced_RON_primary_reference_auction_missing_official_pdfs.py
      - tests/test_mof_announced_RON_primary_reference_auction_recovered_official_pdfs.py
      - tests/test_mof_announced_RON_primary_reference_auction_missing_official_pdfs.py
      - model/dynamics/mof_announced_RON_primary_reference_auction_full_2025_source_vintage_contract.json
  workflow_dispatch:

concurrency:
  group: mof-recovered-official-pdf-promotion
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Verify recovery and promotion invariants
        run: |
          python -m unittest \
            tests.test_mof_announced_RON_primary_reference_auction_missing_official_pdfs \
            tests.test_mof_announced_RON_primary_reference_auction_recovered_official_pdfs -v

      - name: Verify reproducible 4-to-9 source transition
        run: |
          rm -rf mof_recovered_official_pdf_source_vintage_artifact
          python scripts/promote_mof_announced_RON_primary_reference_auction_recovered_official_pdfs.py \
            --output mof_recovered_official_pdf_source_vintage_artifact

      - name: Retain recovered official sources atomically
        run: |
          BRANCH="recovery/mof-announced-ron-primary-reference-auction-missing-sources-2026-09-20"
          DEST="data/source_vintages/mof-announced-ron-primary-reference-auction-full-2025-vintage-2026-09-20"
          OUT="mof_recovered_official_pdf_source_vintage_artifact"

          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"

          rm -rf "$OUT"
          python -m unittest \
            tests.test_mof_announced_RON_primary_reference_auction_missing_official_pdfs \
            tests.test_mof_announced_RON_primary_reference_auction_recovered_official_pdfs -v
          python scripts/promote_mof_announced_RON_primary_reference_auction_recovered_official_pdfs.py \
            --output "$OUT"

          mkdir -p "$DEST/official_pdf_crosschecks" "$DEST/native_text"
          cp -a "$OUT/official_pdf_crosschecks/." "$DEST/official_pdf_crosschecks/"
          cp -a "$OUT/native_text/." "$DEST/native_text/"
          cp "$OUT/source_vintage_manifest.json" "$DEST/source_vintage_manifest.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST/official_pdf_crosschecks" "$DEST/native_text" "$DEST/source_vintage_manifest.json"

          if git diff --cached --quiet; then
            echo "Recovered source vintage already retained and verified."
            exit 0
          fi

          git commit -m "data: retain five recovered official Ministry source PDFs"
          git push origin HEAD:"$BRANCH"

      - name: Upload exact promoted source-vintage artifact
        uses: actions/upload-artifact@v4
        with:
          name: mof-recovered-official-pdf-source-vintage-${{ github.sha }}
          path: mof_recovered_official_pdf_source_vintage_artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
