name: BNR BLS Missing-Round Workbook Recovery

# CURRENT ROLE: HISTORICAL PREREGISTERED-CANDIDATE REPLAY UNTIL A NEW
# OFFICIAL 2025-Q2 EXACT-SOURCE TRIGGER IS SATISFIED.
# Manual execution before that trigger may only reproduce frozen historical
# candidate-access evidence; an unchanged rerun is not scientific progress.
# After a trigger, the recovery contract must first be updated with the exact
# semantically bound 2025-Q2 target before this workflow is used for acquisition.
# It cannot mutate the canonical BLS panel or open estimation without a separate
# promotion/extraction review.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-missing-bnr-bls-workbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen recovery contract
        run: |
          python -m unittest \
            tests.test_bnr_bls_missing_round_workbook_recovery_contract -v

      - name: Probe only preregistered official workbook endpoints
        env:
          BNR_BLS_MISSING_ROUND_RECOVERY_OUT: bnr_bls_missing_round_recovery_artifacts
        run: python scripts/audit_bnr_bls_missing_round_workbook_recovery.py

      - name: Upload source-acquisition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bnr-bls-missing-round-recovery-${{ github.sha }}
          path: bnr_bls_missing_round_recovery_artifacts/
          if-no-files-found: error
          retention-days: 90
