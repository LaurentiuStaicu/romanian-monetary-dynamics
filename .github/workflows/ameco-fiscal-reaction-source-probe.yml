name: AMECO Fiscal Reaction Source Structure Probe

# HISTORICAL SPRING-2026 RE-PROBE ONLY.
# This manual workflow is bound to the frozen Spring-2026 legacy-ZIP probe
# contract used by the retained 2026-09-19 vintage. It is not the execution
# path for the future Autumn-2026 Redisstat source cycle. That future cycle
# requires a separate preregistered contract/workflow after the release exists
# and the provider Redisstat dataset identity has been verified.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-ameco-fiscal-reaction-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run exact AMECO source-structure probe
        env:
          FISCAL_REACTION_AMECO_PROBE_OUT: fiscal_reaction_ameco_probe_artifacts
        run: python scripts/audit_ameco_fiscal_reaction_source_structure.py

      - name: Upload AMECO structure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ameco-fiscal-reaction-source-probe-${{ github.sha }}
          path: fiscal_reaction_ameco_probe_artifacts/
          if-no-files-found: error
          retention-days: 90
