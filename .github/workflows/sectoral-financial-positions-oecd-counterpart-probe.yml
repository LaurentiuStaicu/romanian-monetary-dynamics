name: Sectoral Financial Positions OECD Counterpart Discovery Probe

# TRIGGER-CONDITIONED HISTORICAL DISCOVERY REPLAY.
# The retained OECD source boundary is exhausted under the current canonical
# horizon. Manual reruns against unchanged topology are reproducibility only,
# not new scientific progress. Treat live acquisition as current work only
# after the accounting_counterpart_topology trigger is satisfied and a new
# source-topology pass is preregistered.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-oecd-counterpart-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify frozen OECD discovery contract and probe logic
        run: |
          python -m unittest tests.test_sectoral_financial_positions_external_source_screening -v
          python -m unittest tests.test_sectoral_financial_positions_oecd_counterpart_probe_contract -v
          python -m unittest tests.test_sectoral_financial_positions_oecd_counterpart_probe -v
      - name: Probe exact OECD Romania country coverage
        env:
          OECD_SECTORAL_COUNTERPART_PROBE_OUT: sectoral_financial_positions_oecd_counterpart_probe_artifacts
        run: python scripts/audit_oecd_sectoral_financial_positions_counterpart_probe.py
      - name: Upload source-access evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sectoral-financial-positions-oecd-counterpart-probe-${{ github.sha }}
          path: sectoral_financial_positions_oecd_counterpart_probe_artifacts/
          if-no-files-found: error
          retention-days: 90
