name: Corporate Investment Source Family Materialisation

# Live provider refresh is manual-only after the frozen FAIL_BEFORE_HOLDOUT result.
# Unchanged reruns are reproduction only; reopening requires a separately preregistered cycle.

# One-shot PR bootstrap for exact source retention only.
# No target selection, transformation, cross-frequency join or estimation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialise-corporate-investment-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen source contract
        run: python -m unittest tests.test_corporate_investment_materialisation_contract -v

      - name: Run exact live source-family materialisation
        env:
          CORPORATE_INVESTMENT_MATERIALISATION_OUT: corporate_investment_materialisation_artifacts
        run: python scripts/audit_corporate_investment_source_materialisation.py --allow-live-refetch

      - name: Upload corporate-investment source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corporate-investment-source-materialisation-${{ github.sha }}
          path: corporate_investment_materialisation_artifacts/
          if-no-files-found: error
          retention-days: 90
