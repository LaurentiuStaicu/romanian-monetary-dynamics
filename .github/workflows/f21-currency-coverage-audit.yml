name: F21 Currency Coverage Audit

# Live provider refresh is manual-only under the terminal Accounting Spine hold.
# Unchanged reruns are reproduction only and do not satisfy a reopen trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f21-currency-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify F21 audit contract
        run: python -m unittest tests.test_f21_currency_coverage_contract -v

      - name: Probe exact ECB QSA F21 coverage
        env:
          F21_AUDIT_OUT: f21_audit_artifacts
        run: python scripts/audit_qsa_f21_currency_coverage.py

      - name: Upload F21 coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: f21-currency-coverage-${{ github.sha }}
          path: f21_audit_artifacts/
          if-no-files-found: error
          retention-days: 30
