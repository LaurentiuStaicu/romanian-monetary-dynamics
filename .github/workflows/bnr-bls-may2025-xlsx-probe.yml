name: BNR BLS May 2025 XLSX Identity Probe

# HISTORICAL MAY-2025 XLSX IDENTITY RE-PROBE ONLY.
# The exact 2025-06-13 source vintage is retained after review. A rerun checks
# only the same frozen candidate URLs; it is not a new BLS vintage and does not
# satisfy the still-closed 2025-Q2 exact-source reopen trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-bnr-bls-xlsx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify frozen source-identity contract
        run: python -m unittest tests.test_bnr_bls_may2025_xlsx_probe -v
      - name: Fetch exact official XLSX candidates
        env:
          BNR_BLS_XLSX_PROBE_OUT: bnr_bls_xlsx_probe_artifacts
        run: python scripts/audit_bnr_bls_may2025_xlsx_probe.py
      - name: Upload exact source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bnr-bls-may2025-xlsx-probe-${{ github.sha }}
          path: bnr_bls_xlsx_probe_artifacts/
          if-no-files-found: error
          retention-days: 90
