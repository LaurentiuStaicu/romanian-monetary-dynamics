name: Fiscal Reaction CAPB Pre-2022 Source Structure Probe

# HISTORICAL PRE-2022 ARCHIVE RE-PROBE ONLY.
# This manual workflow is bound to a frozen historical archive contract. A
# rerun may reproduce historical source-access evidence but is not a new AMECO
# vintage and is not a future Redisstat execution path. Provider/network
# failures remain indeterminate and must never be converted into target absence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-capb-pre2022-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen pre-2022 CAPB probe contract
        run: python -m unittest tests.test_fiscal_reaction_capb_pre2022_source_probe -v

      - name: Re-probe historical pre-2022 CAPB source structure
        env:
          FISCAL_CAPB_PRE2022_PROBE_OUT: fiscal_capb_pre2022_probe_artifacts
        run: python scripts/audit_fiscal_capb_pre2022_source_probe.py

      - name: Upload pre-2022 CAPB source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fiscal-capb-pre2022-source-probe-${{ github.sha }}
          path: fiscal_capb_pre2022_probe_artifacts/
          if-no-files-found: error
          retention-days: 90
