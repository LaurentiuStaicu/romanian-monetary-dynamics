name: F21 BPM6 ESA Concept Bridge Audit

# Live provider refresh is manual-only under the terminal Accounting Spine hold.
# Unchanged reruns are reproduction only and do not satisfy a reopen trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f21-bpm6-esa-concept-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify BPM6-to-ESA bridge contract
        run: python -m unittest tests.test_f21_bpm6_esa_concept_bridge_contract -v

      - name: Test BPM6-to-ESA external F2 concept bridge
        env:
          F21_CONCEPT_BRIDGE_OUT: f21_concept_bridge_artifacts
        run: python scripts/audit_f21_bpm6_esa_concept_bridge.py

      - name: Upload concept-bridge evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f21-bpm6-esa-concept-bridge-${{ github.sha }}
          path: f21_concept_bridge_artifacts/
          if-no-files-found: error
          retention-days: 30
