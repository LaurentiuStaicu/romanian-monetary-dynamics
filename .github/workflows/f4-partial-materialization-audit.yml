name: F4 Partial Materialization Audit

on:
  pull_request:
    paths:
      - "data/source_vintages/accounting-f4-partial-2025-vintage-2026-09-18/**"
      - "model/accounting/f4_partial_materialization_contract.json"
      - "model/accounting/f4_partial_2025.json"
      - "model/accounting/f4_partial_materialization_manifest.json"
      - "scripts/generate_f4_partial_from_snapshot.py"
      - "scripts/verify_f4_partial_source_vintage.py"
      - "tests/test_f4_partial_materialization.py"
      - ".github/workflows/f4-partial-materialization-audit.yml"
      - "model/accounting/source_registry.json"
      - "model/accounting/reconciliation_2025.json"
      - "STATUS.md"
  push:
    branches:
      - main
    paths:
      - "data/source_vintages/accounting-f4-partial-2025-vintage-2026-09-18/**"
      - "model/accounting/f4_partial_materialization_contract.json"
      - "model/accounting/f4_partial_2025.json"
      - "model/accounting/f4_partial_materialization_manifest.json"
      - "scripts/generate_f4_partial_from_snapshot.py"
      - "scripts/verify_f4_partial_source_vintage.py"
      - "tests/test_f4_partial_materialization.py"
      - ".github/workflows/f4-partial-materialization-audit.yml"
      - "model/accounting/source_registry.json"
      - "model/accounting/reconciliation_2025.json"
      - "STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-f4-partial:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The exact Phase-B source vintage was retained on 2026-09-18 and is
      # verified offline below. This workflow is now reproduction/verification
      # only; it must not refetch or mutate the historical source vintage.

      - name: Verify immutable source vintage offline
        run: python scripts/verify_f4_partial_source_vintage.py

      - name: Run partial F4 materialization tests
        run: python -m unittest tests.test_f4_partial_materialization -v

      - name: Regenerate partial F4 entirely offline
        run: |
          mkdir -p generated
          python scripts/generate_f4_partial_from_snapshot.py             --component-output generated/f4_partial_2025.json             --manifest-output generated/f4_partial_materialization_manifest.json

      - name: Require deterministic semantic reproduction
        run: |
          python scripts/check_json_semantic_equivalence.py             model/accounting/f4_partial_2025.json             generated/f4_partial_2025.json
          python scripts/check_json_semantic_equivalence.py             model/accounting/f4_partial_materialization_manifest.json             generated/f4_partial_materialization_manifest.json

      - name: Upload regenerated evidence
        uses: actions/upload-artifact@v4
        with:
          name: f4-partial-materialization-${{ github.sha }}
          path: generated/
          if-no-files-found: error
          retention-days: 90
