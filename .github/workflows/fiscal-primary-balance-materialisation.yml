name: Fiscal Primary Balance Source Materialisation

# Live-source refresh/materialisation is manual-only. The pre-merge bootstrap
# run has been retained as an immutable reviewed source vintage. Future refresh
# work remains workflow_dispatch-only and never runs in ordinary PR/CI activity.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialise-fiscal-primary-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen primary-balance materialisation contract
        run: python -m unittest tests.test_fiscal_primary_balance_materialisation_contract -v

      - name: Run live fiscal primary-balance source materialisation
        env:
          FISCAL_PRIMARY_BALANCE_OUT: fiscal_primary_balance_artifacts
        run: python scripts/audit_fiscal_primary_balance_materialisation.py

      - name: Upload fiscal primary-balance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fiscal-primary-balance-materialisation-${{ github.sha }}
          path: fiscal_primary_balance_artifacts/
          if-no-files-found: error
          retention-days: 90
