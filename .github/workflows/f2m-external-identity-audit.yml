name: F2M External Identity Audit

# Live provider refresh is manual-only under the terminal Accounting Spine hold.
# Unchanged reruns are reproduction only and do not satisfy a reopen trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f2m-external-complement:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Re-run Phase A1 F2M coverage audit
        env:
          F2M_AUDIT_OUT: f2m_audit_artifacts
        run: python scripts/audit_qsa_f2m_deposit_coverage.py

      - name: Test QSA W0/W2/W1 external complement identities
        env:
          F2M_AUDIT_IN: f2m_audit_artifacts
          F2M_EXTERNAL_AUDIT_OUT: f2m_external_audit_artifacts
        run: python scripts/audit_qsa_f2m_external_identity.py

      - name: Upload Phase A1 and A2 audit evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f2m-external-identity-${{ github.sha }}
          path: |
            f2m_audit_artifacts/
            f2m_external_audit_artifacts/
          if-no-files-found: error
          retention-days: 30
