name: Sectoral Financial Positions Aggregate Identity Audit


# Phase B live QSA refresh is manual after the retained immutable run. The
# historical scientific result is reproduced offline from the committed
# assessment and invariant tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-sectoral-financial-positions-phase-b:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify preregistered Phase B aggregate-identity contract
        run: python -m unittest tests.test_sectoral_financial_positions_aggregate_identity_contract -v

      - name: Probe ECB QSA total-F-minus-F1 aggregate identity
        env:
          SECTORAL_POSITIONS_PHASE_B_AUDIT_OUT: sectoral_positions_phase_b_audit_artifacts
        run: python scripts/audit_ecb_sectoral_financial_positions_aggregate_identity.py

      - name: Upload Phase B source-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sectoral-financial-positions-phase-b-${{ github.sha }}
          path: sectoral_positions_phase_b_audit_artifacts/
          if-no-files-found: error
          retention-days: 90
