name: F7 Financial Derivatives Coverage Audit

# Historical scientific conclusions are reproduced from retained repository
# snapshots/assessments. This workflow intentionally performs a live provider
# refresh only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f7-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify F7 coverage contract
        run: python -m unittest tests.test_f7_financial_derivatives_coverage_contract -v

      - name: Probe exact ECB QSA F7 coverage
        env:
          F7_AUDIT_OUT: f7_audit_artifacts
        run: python scripts/audit_qsa_f7_financial_derivatives_coverage.py

      - name: Upload F7 source-coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f7-financial-derivatives-coverage-${{ github.sha }}
          path: f7_audit_artifacts/
          if-no-files-found: error
          retention-days: 90
