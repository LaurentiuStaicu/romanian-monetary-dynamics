name: F3 Materialization Audit

on:
  pull_request:
    paths:
      - "model/accounting/f3_materialization_contract.json"
      - "data/source_vintages/accounting-f3-2025-vintage-2026-09-18/**"
      - "scripts/audit_qsa_accounting_coverage.py"
      - "scripts/verify_f3_source_vintage.py"
      - "scripts/verify_f3_raw_to_audit.py"
      - "scripts/generate_f3_benchmark_from_snapshot.py"
      - "tests/test_f3_materialization.py"
      - "tests/test_dynamic_core.py"
      - ".github/workflows/f3-materialization-audit.yml"
      - "model/accounting/benchmark_2025.json"
      - "model/accounting/f3_materialization_manifest.json"
      - "model/accounting/source_registry.json"
      - "model/accounting/reconciliation_2025.json"
  push:
    branches:
      - main
    paths:
      - "model/accounting/f3_materialization_contract.json"
      - "data/source_vintages/accounting-f3-2025-vintage-2026-09-18/**"
      - "scripts/audit_qsa_accounting_coverage.py"
      - "scripts/verify_f3_source_vintage.py"
      - "scripts/verify_f3_raw_to_audit.py"
      - "scripts/generate_f3_benchmark_from_snapshot.py"
      - "tests/test_f3_materialization.py"
      - "tests/test_dynamic_core.py"
      - ".github/workflows/f3-materialization-audit.yml"
      - "model/accounting/benchmark_2025.json"
      - "model/accounting/f3_materialization_manifest.json"
      - "model/accounting/source_registry.json"
      - "model/accounting/reconciliation_2025.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-regenerate-f3:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify immutable F3 source vintage offline
        run: python scripts/verify_f3_source_vintage.py

      - name: Rebuild F3 audit from retained raw responses offline
        run: python scripts/verify_f3_raw_to_audit.py

      - name: Run F3 materialization tests
        run: python -m unittest tests.test_f3_materialization -v

      - name: Regenerate F3 benchmark entirely offline
        run: |
          mkdir -p generated
          python scripts/generate_f3_benchmark_from_snapshot.py \
            --benchmark-input model/accounting/benchmark_2025.json \
            --benchmark-output generated/benchmark_2025.json \
            --materialization-output generated/f3_materialization_manifest.json

      - name: Require deterministic semantic reproduction
        run: |
          python scripts/check_json_semantic_equivalence.py \
            model/accounting/benchmark_2025.json \
            generated/benchmark_2025.json
          python scripts/check_json_semantic_equivalence.py \
            model/accounting/f3_materialization_manifest.json \
            generated/f3_materialization_manifest.json

      - name: Upload regenerated evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f3-materialization-regeneration-${{ github.sha }}
          path: generated/
          if-no-files-found: error
          retention-days: 30
