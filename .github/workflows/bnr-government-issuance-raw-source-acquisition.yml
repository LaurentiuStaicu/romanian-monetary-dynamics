name: BNR Government Issuance Raw Source Acquisition

on:
  push:
    branches:
      - source-vintage/bnr-government-issuance-raw-2026-09-20
    paths:
      - .github/workflows/bnr-government-issuance-raw-source-acquisition.yml
      - model/dynamics/government_debt_issuance_bnr_raw_source_acquisition_contract.json
      - scripts/acquire_bnr_government_issuance_raw_source.py
      - tests/test_bnr_government_issuance_raw_source_acquisition.py

permissions:
  contents: write

jobs:
  acquire-reviewed-bnr-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out acquisition branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify frozen acquisition contract and offline guards
        run: python -m unittest tests.test_bnr_government_issuance_raw_source_acquisition -v

      - name: Acquire exact official BNR source
        run: |
          python scripts/acquire_bnr_government_issuance_raw_source.py \
            --output bnr_government_issuance_raw_artifacts

      - name: Retain or independently reverify exact raw source vintage
        run: |
          DEST="data/source_vintages/bnr-government-issuance-2025-vintage-2026-09-20"
          if [ -e "$DEST" ]; then
            cmp \
              bnr_government_issuance_raw_artifacts/raw/bnr_monthly_bulletin_12_2025.pdf \
              "$DEST/raw/bnr_monthly_bulletin_12_2025.pdf"
            python - <<'PY'
          import json
          from pathlib import Path
          fresh = json.loads(Path("bnr_government_issuance_raw_artifacts/source_vintage_manifest.json").read_text())
          kept = json.loads(Path("data/source_vintages/bnr-government-issuance-2025-vintage-2026-09-20/source_vintage_manifest.json").read_text())
          for key in ("bytes", "sha256", "url", "accept"):
              if fresh["raw_source"][key] != kept["raw_source"][key]:
                  raise SystemExit(f"retained BNR raw-source mismatch: {key}")
          print("Retained BNR raw source is byte-identical to the fresh fixed-URL acquisition.")
          PY
          else
            mkdir -p "$DEST"
            cp -a bnr_government_issuance_raw_artifacts/. "$DEST/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            git diff --cached --quiet && { echo "No retained source-vintage changes."; exit 1; }
            git commit -m "data: retain exact BNR government issuance source vintage"
            git push origin HEAD:source-vintage/bnr-government-issuance-raw-2026-09-20
          fi

      - name: Upload exact raw source and manifest
        uses: actions/upload-artifact@v4
        with:
          name: bnr-government-issuance-raw-${{ github.sha }}
          path: bnr_government_issuance_raw_artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
