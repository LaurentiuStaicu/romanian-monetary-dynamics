name: AMECO Fiscal Reaction Annual Source Materialisation

# HISTORICAL SPRING-2026 RE-MATERIALISATION ONLY.
# This manual workflow is bound to the frozen Spring-2026 legacy-ZIP
# materialisation contract. The reviewed 2026-09-19 actual-only source vintage
# is retained immutably in-repository. Re-running this workflow is not evidence
# for an Autumn-2026 vintage. The future Redisstat source cycle requires a
# separate preregistered contract/workflow after the release exists and the
# provider dataset identity has been verified.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialise-ameco-fiscal-reaction-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen AMECO materialisation contract
        run: python -m unittest tests.test_fiscal_reaction_ameco_materialisation_contract -v

      - name: Run live AMECO annual source materialisation
        env:
          FISCAL_REACTION_AMECO_MATERIALISATION_OUT: fiscal_reaction_ameco_materialisation_artifacts
        run: python scripts/audit_ameco_fiscal_reaction_materialisation.py

      - name: Upload AMECO annual source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ameco-fiscal-reaction-materialisation-${{ github.sha }}
          path: fiscal_reaction_ameco_materialisation_artifacts/
          if-no-files-found: error
          retention-days: 90
