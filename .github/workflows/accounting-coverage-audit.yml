name: Accounting Coverage Audit

# Live provider refresh is manual-only under the terminal Accounting Spine hold.
# Unchanged reruns are reproduction only and do not satisfy a reopen trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qsa-f3-source-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run offline contract tests
        run: python -m unittest tests.test_accounting_recovery_contract -v

      - name: Audit ECB QSA F3 source coverage without changing benchmark
        env:
          ACCOUNTING_AUDIT_OUT: accounting_audit_artifacts
        run: python scripts/audit_qsa_accounting_coverage.py

      - name: Upload raw responses and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: accounting-qsa-f3-coverage-${{ github.sha }}
          path: accounting_audit_artifacts/
          if-no-files-found: error
          retention-days: 30
