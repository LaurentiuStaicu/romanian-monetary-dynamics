name: FX Inflation Monthly Source Materialisation

# Live provider refresh/materialisation is manual-only. The reviewed
# 2026-09-19 level-only source vintage is retained immutably in-repository.
# A future run may provide candidate new-vintage evidence only if provider
# identity/bytes or the retained observation vintage materially change; an
# unchanged rerun is reproduction only. No rerun reopens the failed FX
# pass-through mechanism without its separately declared measurement or
# identification trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialise-fx-inflation-monthly-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen materialisation contracts
        run: |
          python -m unittest tests.test_fx_inflation_external_price_control_contract -v
          python -m unittest tests.test_fx_inflation_monthly_materialisation_contract -v

      - name: Run exact live level-only source materialisation
        env:
          FX_INFLATION_MATERIALISATION_OUT: fx_inflation_materialisation_artifacts
        run: python scripts/audit_fx_inflation_monthly_materialisation.py

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fx-inflation-monthly-materialisation-${{ github.sha }}
          path: fx_inflation_materialisation_artifacts/
          if-no-files-found: error
          retention-days: 90
