name: Fiscal Reaction CAPB Real-Time Vintage Materialisation

# HISTORICAL 2022-SPRING-2026 ARCHIVE RE-MATERIALISATION ONLY.
# This manual workflow is bound to the frozen release list in
# fiscal_reaction_capb_realtime_vintage_contract.json. A rerun reproduces the
# retained historical archive boundary; it is not a new AMECO vintage and is
# not the execution path for the future Autumn-2026 Redisstat source cycle.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialise-capb-realtime-vintages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify frozen CAPB vintage contract
        run: python -m unittest tests.test_fiscal_reaction_capb_realtime_vintage_contract -v

      - name: Re-materialise historical AMECO CAPB vintages
        env:
          FISCAL_REACTION_CAPB_VINTAGE_OUT: fiscal_reaction_capb_vintage_artifacts
        run: python scripts/materialise_fiscal_reaction_capb_realtime_vintages.py

      - name: Upload CAPB vintage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiscal-reaction-capb-realtime-vintages-${{ github.sha }}
          path: fiscal_reaction_capb_vintage_artifacts/
          if-no-files-found: error
          retention-days: 90
