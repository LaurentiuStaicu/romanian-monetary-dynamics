name: Scientific CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  manual-eurostat-counterpart-probe:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref_name == 'audit/scientific-integrity-2026-09-18') || (github.event_name == 'pull_request' && github.head_ref == 'audit/scientific-integrity-2026-09-18' && github.run_attempt > 1) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected manual ref
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify frozen Eurostat discovery contract and probe logic
        run: |
          python -m unittest tests.test_sectoral_financial_positions_external_source_screening -v
          python -m unittest tests.test_sectoral_financial_positions_eurostat_counterpart_probe_contract -v
          python -m unittest tests.test_sectoral_financial_positions_eurostat_counterpart_probe -v

      - name: Run manual Eurostat counterpart discovery probe
        env:
          EUROSTAT_COUNTERPART_PROBE_OUT: sectoral_financial_positions_eurostat_counterpart_probe_artifacts
        run: python scripts/audit_eurostat_sectoral_financial_positions_counterpart_probe.py

      - name: Upload Eurostat source-access evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-eurostat-counterpart-probe-${{ github.sha }}
          path: sectoral_financial_positions_eurostat_counterpart_probe_artifacts/
          if-no-files-found: error
          retention-days: 90

  manual-oecd-counterpart-probe:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref_name == 'audit/scientific-integrity-2026-09-18') || (github.event_name == 'pull_request' && github.head_ref == 'audit/scientific-integrity-2026-09-18' && github.run_attempt > 1) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected manual ref
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify frozen OECD discovery contract and probe logic
        run: |
          python -m unittest tests.test_sectoral_financial_positions_external_source_screening -v
          python -m unittest tests.test_sectoral_financial_positions_oecd_counterpart_probe_contract -v
          python -m unittest tests.test_sectoral_financial_positions_oecd_counterpart_probe -v

      - name: Run manual OECD counterpart discovery probe
        env:
          OECD_SECTORAL_COUNTERPART_PROBE_OUT: sectoral_financial_positions_oecd_counterpart_probe_artifacts
        run: python scripts/audit_oecd_sectoral_financial_positions_counterpart_probe.py

      - name: Upload OECD source-access evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-oecd-counterpart-probe-${{ github.sha }}
          path: sectoral_financial_positions_oecd_counterpart_probe_artifacts/
          if-no-files-found: error
          retention-days: 90

  manual-bnr-bls-missing-round-recovery:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref_name == 'audit/scientific-integrity-2026-09-18') || (github.event_name == 'pull_request' && github.head_ref == 'audit/scientific-integrity-2026-09-18' && github.run_attempt > 1) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected manual ref
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify frozen BNR BLS missing-round recovery contract
        run: |
          python -m unittest tests.test_bnr_bls_missing_round_workbook_recovery_contract -v

      - name: Probe only preregistered official BNR workbook candidates
        env:
          BNR_BLS_MISSING_ROUND_RECOVERY_OUT: bnr_bls_missing_round_recovery_artifacts
        run: python scripts/audit_bnr_bls_missing_round_workbook_recovery.py

      - name: Upload BNR BLS source-acquisition evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-bnr-bls-missing-round-recovery-${{ github.sha }}
          path: bnr_bls_missing_round_recovery_artifacts/
          if-no-files-found: error
          retention-days: 90

  manual-oecd-nonconsolidated-topology-probe:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'source-topology/oecd-nonconsolidated-sectoral-financial-positions-2026-09-21' && github.run_attempt > 1 }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out frozen source-topology branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify preregistered OECD non-consolidated topology contract
        run: python -m unittest tests.test_oecd_sectoral_financial_positions_nonconsolidated_probe -v

      - name: Probe OECD Romania non-consolidated topology only
        env:
          OECD_NONCONSOLIDATED_TOPOLOGY_OUT: oecd_nonconsolidated_topology_artifacts
        run: python scripts/audit_oecd_sectoral_financial_positions_nonconsolidated_probe.py

      - name: Upload topology/source-access evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oecd-nonconsolidated-topology-probe-${{ github.sha }}
          path: oecd_nonconsolidated_topology_artifacts/
          if-no-files-found: error
          retention-days: 90

  manual-oecd-exact-reference-reconciliation:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'source-topology/oecd-nonconsolidated-sectoral-financial-positions-2026-09-21' && github.run_attempt > 1 }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out frozen source-topology branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify exact OECD extraction/reconciliation preregistration
        run: python -m unittest tests.test_oecd_sectoral_financial_positions_exact_reconciliation -v

      - name: Run exact OECD RMD aggregate row/reconciliation gate
        env:
          OECD_EXACT_REFERENCE_OUT: oecd_exact_reference_artifacts
        run: python scripts/audit_oecd_sectoral_financial_positions_exact_reconciliation.py

      - name: Upload exact source/reconciliation evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oecd-exact-reference-reconciliation-${{ github.sha }}
          path: oecd_exact_reference_artifacts/
          if-no-files-found: error
          retention-days: 90

  manual-oecd-semantic-adjusted-reference-reconciliation:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'model/esa2010-s1m-f2-liability-semantic-gate-2026-09-21' && github.run_attempt > 1 }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out frozen semantic-gate branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify ESA2010 semantic preregistration
        run: |
          python scripts/audit_esa2010_s1m_f2_liability_semantic_gate.py
          python -m unittest tests.test_oecd_sectoral_financial_positions_semantic_adjusted_gate -v

      - name: Run semantic-adjusted OECD aggregate reference gate
        env:
          OECD_SEMANTIC_REFERENCE_OUT: oecd_semantic_reference_artifacts
        run: python scripts/audit_oecd_sectoral_financial_positions_semantic_adjusted_gate.py

      - name: Upload semantic-adjusted source/reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oecd-semantic-adjusted-reference-${{ github.sha }}
          path: oecd_semantic_reference_artifacts/
          if-no-files-found: error
          retention-days: 90

  verify-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify clean wheel installation and import
        run: |
          python -m venv /tmp/rmd-clean
          /tmp/rmd-clean/bin/python -m pip install --no-deps dist/*.whl
          (
            cd /tmp
            /tmp/rmd-clean/bin/python -c "import romania_macro_financial_dynamics as rmd; assert rmd.__version__ == '0.2.0'"
          )

      - name: Install built wheel for repository tests
        run: python -m pip install --no-deps dist/*.whl

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run scientific invariant tests
        run: python -m unittest discover -s tests -v

      - name: Audit canonical Accounting Spine readiness
        run: python scripts/audit_accounting_readiness.py

      - name: Audit BNR 2025 financial-accounts topology reopen
        run: python scripts/audit_bnr_2025_financial_accounts_topology_reopen.py

      - name: Audit terminal OECD exact-row gate
        run: python scripts/audit_oecd_sectoral_financial_positions_exact_row_gate.py

      - name: Audit ESA2010 S1M/F2 semantic preregistration
        run: python scripts/audit_esa2010_s1m_f2_liability_semantic_gate.py

      - name: Audit terminal semantic-adjusted OECD reconciliation state
        run: python scripts/audit_oecd_sectoral_financial_positions_semantic_adjusted_terminal.py

      - name: Audit OECD dissemination-precision diagnostic
        run: python scripts/audit_oecd_sectoral_financial_positions_precision_diagnostic.py

      - name: Audit exact-decimal OECD reconciliation correction
        run: python scripts/audit_oecd_sectoral_financial_positions_decimal_arithmetic_correction.py

      - name: Audit OECD reconciliation window stability
        run: python scripts/audit_oecd_sectoral_financial_positions_window_stability.py

      - name: Audit successor trigger-aware monitoring horizon
        run: python scripts/audit_trigger_aware_monitoring_horizon_2026_09_21.py

      - name: Audit F3 empirical dynamic replay
        run: python scripts/audit_f3_empirical_replay.py

      - name: Audit F3 observed behavior diagnostics
        run: python scripts/audit_f3_behavior_diagnostics.py

      - name: Audit government F3 holder diagnostic
        run: python scripts/audit_government_f3_holder_diagnostic.py

      - name: Audit government debt issuance source boundary
        run: python scripts/audit_government_debt_issuance_source_boundary.py

      - name: Audit reviewed BNR government issuance pilot
        run: python scripts/audit_bnr_government_issuance_pilot.py

      - name: Audit retained BNR government issuance raw source
        run: python scripts/audit_bnr_government_issuance_raw_source_retention.py

      - name: Audit government issuance-yield empirical boundary preregistration
        run: python scripts/audit_government_issuance_yield_boundary_preregistration.py

      - name: Audit BNR instrument-specific primary-market rate pilot
        run: python scripts/audit_bnr_primary_market_yield_pilot.py

      - name: Audit primary-yield to sovereign-yield boundary
        run: python scripts/audit_primary_yield_to_sovereign_yield_boundary.py

      - name: Audit sovereign-yield to government-interest-cost boundary
        run: python scripts/audit_yield_to_interest_cost_boundary.py

      - name: Audit government-interest-cost to financing-need accounting boundary
        run: python scripts/audit_interest_cost_to_financing_need_boundary.py

      - name: Audit financing-channel allocation boundary
        run: python scripts/audit_financing_channel_allocation_boundary.py

      - name: Audit Ministry realized-financing channel source contract
        run: python scripts/audit_mof_realized_financing_channel_materialisation_contract.py

      - name: Audit Ministry realized-financing full-year source vintage
        run: python scripts/audit_mof_realized_financing_channel_source_vintage_assessment.py

      - name: Audit government debt issuance-to-stock accounting boundary
        run: python scripts/audit_government_debt_issuance_to_debt_stock_boundary.py

      - name: Audit credit-flow to loan-stock accounting boundary
        run: python scripts/audit_credit_flow_to_loan_stock_boundary.py

      - name: Audit loan-stock to debt-service and credit-risk boundary
        run: python scripts/audit_loan_stock_to_debt_service_and_credit_risk_boundary.py

      - name: Audit risk to credit-supply-capacity boundary
        run: python scripts/audit_debt_service_and_credit_risk_to_credit_supply_capacity_boundary.py

      - name: Audit credit-supply-capacity to credit-flow boundary
        run: python scripts/audit_credit_supply_capacity_to_credit_flow_boundary.py

      - name: Audit bank credit-balance-sheet loop terminal state
        run: python scripts/audit_bank_credit_balance_sheet_loop_terminal_assessment.py

      - name: Audit policy-rate to market-and-lending-rates boundary
        run: python scripts/audit_policy_rate_to_market_and_lending_rates_boundary.py

      - name: Audit market-and-lending-rates to credit-flow boundary
        run: python scripts/audit_market_and_lending_rates_to_credit_flow_boundary.py

      - name: Audit credit-flow to private-demand and investment boundary
        run: python scripts/audit_credit_flow_to_private_demand_and_investment_boundary.py

      - name: Audit private-demand and investment to inflationary-pressure boundary
        run: python scripts/audit_private_demand_and_investment_to_inflationary_pressure_boundary.py

      - name: Audit inflationary-pressure to policy-rate boundary
        run: python scripts/audit_inflationary_pressure_to_policy_rate_boundary.py

      - name: Audit monetary-credit transmission loop terminal state
        run: python scripts/audit_monetary_credit_transmission_loop_terminal_assessment.py

      - name: Audit external FX-refinancing open-chain terminal state
        run: python scripts/audit_external_fx_refinancing_open_chain_terminal_assessment.py

      - name: Audit complete feedback-architecture structural terminal state
        run: python scripts/audit_feedback_architecture_structural_review_terminal_assessment.py

      - name: Audit government debt-stock to interest-cost accounting boundary
        run: python scripts/audit_government_debt_stock_to_interest_cost_boundary.py

      - name: Audit government refinancing-interest loop terminal state
        run: python scripts/audit_government_refinancing_interest_loop_terminal_assessment.py

      - name: Audit government issuance-yield loop terminal state
        run: python scripts/audit_government_issuance_yield_loop_terminal_assessment.py

      - name: Audit government securities supply-pressure source boundary
        run: python scripts/audit_government_securities_supply_pressure_source_boundary.py

      - name: Audit Ministry supply-pressure source-vintage probe assessment
        run: python scripts/audit_mof_supply_pressure_source_vintage_probe_assessment.py

      - name: Audit government securities supply-load denominator boundary
        run: python scripts/audit_government_securities_supply_load_denominator_boundary.py

      - name: Audit government securities supply measurement design
        run: python scripts/audit_government_securities_supply_measurement_design.py

      - name: Audit announced RON primary-supply reference-mode contract
        run: python scripts/audit_mof_announced_RON_primary_supply_reference_mode_contract.py

      - name: Audit exact Q1 announced RON primary-supply pilot
        run: python scripts/audit_mof_announced_RON_primary_supply_Q1_pilot.py

      - name: Audit full-2025 announced RON supply definition boundary
        run: python scripts/audit_mof_announced_RON_primary_supply_full_2025_definition.py

      - name: Audit partial full-2025 competitive announced-supply materialisation
        run: python scripts/audit_mof_announced_RON_primary_reference_auction_partial_2025.py

      - name: Audit announced-supply missing-source recovery hold
        run: python scripts/audit_mof_announced_RON_primary_reference_auction_missing_source_recovery.py

      - name: Audit ECB supply-load denominator candidate probe assessment
        run: python scripts/audit_ecb_supply_load_denominator_probe_assessment.py

      - name: Recompute dimensional consistency independently
        run: python scripts/audit_dimensional_consistency.py

      - name: Audit numerical integration convergence
        run: python scripts/audit_numerical_integration.py

      - name: Audit behavioural dimensional consistency
        run: python scripts/audit_behavioural_dimensional_consistency.py

      - name: Audit behavioural parameter semantics
        run: python scripts/audit_behavioural_parameter_semantics.py

      - name: Audit feedback endogenous/exogenous boundary
        run: python scripts/audit_feedback_variable_boundary.py

      - name: Audit feedback link activation readiness
        run: python scripts/audit_feedback_link_readiness.py

      - name: Audit candidate delay evidence
        run: python scripts/audit_delay_evidence.py

      - name: Audit per-feedback activation criteria
        run: python scripts/audit_feedback_activation_criteria.py

      - name: Audit behavioural form robustness
        run: python scripts/audit_behavioural_robustness.py

      - name: Run System Dynamics conformity gate explicitly
        run: python scripts/audit_system_dynamics_conformity.py

      - name: Audit cross-registry scientific baseline manifest
        run: python scripts/audit_scientific_baseline_manifest.py

      - name: Audit release publication state
        run: python scripts/audit_release_publication_authorization.py

      - name: Verify retained source-vintage provenance state offline
        run: python scripts/verify_validation_recovery_provenance.py

      - name: Preserve retained validation artifacts
        run: |
          cp model/calibration_validation/validation_recovery_selection.json /tmp/retained_selection.json
          cp model/calibration_validation/validation_recovery_holdout.json /tmp/retained_holdout.json

      - name: Reproduce validation-recovery selection
        run: python scripts/run_validation_recovery_selection.py

      - name: Reproduce authorized household holdout
        run: python scripts/run_validation_recovery_holdout.py

      - name: Verify retained validation artifacts are semantically unchanged
        run: |
          python scripts/check_json_semantic_equivalence.py \
            /tmp/retained_selection.json \
            model/calibration_validation/validation_recovery_selection.json
          python scripts/check_json_semantic_equivalence.py \
            /tmp/retained_holdout.json \
            model/calibration_validation/validation_recovery_holdout.json
