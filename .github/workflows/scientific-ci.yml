name: Scientific CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify clean wheel installation and import
        run: |
          python -m venv /tmp/rmd-clean
          /tmp/rmd-clean/bin/python -m pip install --no-deps dist/*.whl
          EXPECTED_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          (
            cd /tmp
            /tmp/rmd-clean/bin/python -c "import romania_macro_financial_dynamics as rmd; assert rmd.__version__ == '$EXPECTED_VERSION'"
          )

      - name: Install built wheel for repository tests
        run: python -m pip install --no-deps dist/*.whl

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run scientific invariant tests
        run: python -m unittest discover -s tests -v

      - name: Audit canonical Accounting Spine readiness
        run: python scripts/audit_accounting_readiness.py

      - name: Audit F4 Eurostat-BSI exact-bridge diagnostic
        run: python scripts/audit_f4_eurostat_bsi_bridge_diagnostic.py

      - name: Audit F4 ECB RAS reserve-template non-reopen boundary
        run: python scripts/audit_f4_ras_reserve_template_nonreopen.py

      - name: Audit F4 structural-zero successor preregistration
        run: python scripts/audit_f4_structural_zero_successor_preregistration.py

      - name: Audit F4 structural-zero successor execution
        run: python scripts/audit_f4_structural_zero_successor_execution.py

      - name: Audit F4 BNR CNF 2025 stock trigger monitoring
        run: python scripts/audit_f4_bnr_cnf_2025_stock_trigger_monitoring.py

      - name: Audit terminal Accounting Spine recovery state
        run: python scripts/audit_accounting_spine_recovery_terminal.py

      - name: Audit F2 Direct-Investment instrument-dissemination boundary
        run: python scripts/audit_f2_direct_investment_instrument_dissemination.py

      - name: Audit F5 OECD counterpart selective reopen preregistration
        run: python scripts/audit_f5_oecd_counterpart_reopen.py

      - name: Audit F5 OECD counterpart Stage 2 terminal execution
        run: python scripts/audit_f5_oecd_counterpart_stage2_execution.py

      - name: Audit F6 OECD counterpart selective reopen preregistration
        run: python scripts/audit_f6_oecd_counterpart_reopen.py

      - name: Audit F6 OECD counterpart Stage 2 terminal execution
        run: python scripts/audit_f6_oecd_counterpart_stage2_execution.py

      - name: Audit F7 OECD counterpart selective reopen preregistration
        run: python scripts/audit_f7_oecd_counterpart_reopen.py

      - name: Audit F7 OECD counterpart Stage 2 terminal execution
        run: python scripts/audit_f7_oecd_counterpart_stage2_execution.py

      - name: Audit F8 OECD counterpart selective reopen preregistration
        run: python scripts/audit_f8_oecd_counterpart_reopen.py

      - name: Audit F8 OECD counterpart Stage 2 terminal execution
        run: python scripts/audit_f8_oecd_counterpart_stage2_execution.py

      - name: Audit BNR 2025 financial-accounts topology reopen
        run: python scripts/audit_bnr_2025_financial_accounts_topology_reopen.py

      - name: Audit terminal OECD exact-row gate
        run: python scripts/audit_oecd_sectoral_financial_positions_exact_row_gate.py

      - name: Audit ESA2010 S1M/F2 semantic preregistration
        run: python scripts/audit_esa2010_s1m_f2_liability_semantic_gate.py

      - name: Audit terminal semantic-adjusted OECD reconciliation state
        run: python scripts/audit_oecd_sectoral_financial_positions_semantic_adjusted_terminal.py

      - name: Audit OECD dissemination-precision diagnostic
        run: python scripts/audit_oecd_sectoral_financial_positions_precision_diagnostic.py

