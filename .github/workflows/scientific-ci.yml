        run: python scripts/audit_oecd_sectoral_financial_positions_decimal_arithmetic_correction.py

      - name: Audit OECD reconciliation window stability
        run: python scripts/audit_oecd_sectoral_financial_positions_window_stability.py

      - name: Audit ECB QFA 10m horizontal-gate preregistration
        run: python scripts/audit_ecb_qfa_10m_horizontal_gate_preregistration.py

      - name: Audit executed ECB QFA 10m horizontal gate
        run: python scripts/audit_ecb_qfa_10m_horizontal_gate_execution.py

      - name: Audit official-tolerance reference-mode promotion
        run: python scripts/audit_reference_mode_post_terminal_promotion.py

      - name: Audit successor trigger-aware monitoring horizon
        run: python scripts/audit_trigger_aware_monitoring_horizon_2026_09_21.py

      - name: Audit post-F4 trigger-aware monitoring horizon
        run: python scripts/audit_trigger_aware_monitoring_horizon_2026_09_22.py

