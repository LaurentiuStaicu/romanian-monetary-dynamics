        run: python scripts/audit_trigger_aware_monitoring_horizon_post_counterpart_workflow_boundary.py

      - name: Audit post-MoF-recovery trigger-aware monitoring horizon
        run: python scripts/audit_trigger_aware_monitoring_horizon_post_mof_recovery_execution_boundary.py

