name: BNR BLS Cross-Round Semantic Mapping

on:
  pull_request:
    paths:
      - "model/calibration_validation/bnr_bls_cross_round_mapping_contract.json"
      - "model/calibration_validation/bnr_bls_cross_round_mapping_audit.json"
      - "model/calibration_validation/bnr_bls_may2025_xlsx_layout_review.json"
      - "model/calibration_validation/bnr_legacy_xls_cell_extraction_assessment.json"
      - "data/processed/bnr_bls_realised_rounds.csv"
      - "data/source_vintages/bnr-legacy-xls-cell-extraction-vintage-2026-09-19/**"
      - "scripts/materialize_bnr_bls_cross_round_mapping.py"
      - "tests/test_bnr_bls_cross_round_mapping_contract.py"
      - "tests/test_bnr_bls_cross_round_mapping_result.py"
      - ".github/workflows/bnr-bls-cross-round-mapping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify frozen cross-round mapping contract and retained result
        run: |
          python -m unittest tests.test_bnr_bls_cross_round_mapping_contract -v
          python -m unittest tests.test_bnr_bls_cross_round_mapping_result -v
      - name: Materialize only preregistered realised BLS rounds
        run: python scripts/materialize_bnr_bls_cross_round_mapping.py
      - name: Verify generated files are retained and byte-clean
        run: |
          test -f data/processed/bnr_bls_realised_rounds.csv
          test -f model/calibration_validation/bnr_bls_cross_round_mapping_audit.json
          git diff --exit-code -- \
            data/processed/bnr_bls_realised_rounds.csv \
            model/calibration_validation/bnr_bls_cross_round_mapping_audit.json
