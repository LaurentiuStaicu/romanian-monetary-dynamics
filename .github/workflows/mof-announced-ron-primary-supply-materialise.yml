name: Materialise Q1 2025 Announced RON Primary Supply Pilot

on:
  push:
    branches:
      - source-vintage/mof-announced-ron-primary-supply-2026-09-20
    paths:
      - .github/workflows/mof-announced-ron-primary-supply-materialise.yml
      - scripts/materialise_mof_announced_RON_primary_supply_Q1_2025.py
      - tests/test_mof_announced_RON_primary_supply_Q1_materialiser.py
      - data/source_vintages/mof-announced-ron-primary-supply-pilot-2026-09-20/source_vintage_manifest.json
      - data/source_vintages/mof-announced-ron-primary-supply-pilot-2026-09-20/native_text/**
      - model/dynamics/mof_announced_RON_primary_supply_reference_mode_contract_2026_09_20.json

concurrency:
  group: mof-announced-ron-primary-supply-materialise
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialise:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out materialisation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run parser unit tests
        run: python -m unittest tests.test_mof_announced_RON_primary_supply_Q1_materialiser -v

      - name: Materialise exact event and monthly pilot
        run: |
          rm -rf mof_announced_supply_materialised
          python scripts/materialise_mof_announced_RON_primary_supply_Q1_2025.py \
            --output mof_announced_supply_materialised

      - name: Retain or reverify materialised pilot
        run: |
          BRANCH="source-vintage/mof-announced-ron-primary-supply-2026-09-20"
          EVENTS="data/processed/mof_announced_RON_primary_supply_Q1_2025_events.csv"
          MONTHLY="data/processed/mof_announced_RON_primary_supply_Q1_2025_monthly.csv"
          ASSESSMENT="model/dynamics/mof_announced_RON_primary_supply_reference_mode_pilot_Q1_2025.json"

          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"

          mkdir -p data/processed model/dynamics
          cp mof_announced_supply_materialised/mof_announced_RON_primary_supply_Q1_2025_events.csv "$EVENTS"
          cp mof_announced_supply_materialised/mof_announced_RON_primary_supply_Q1_2025_monthly.csv "$MONTHLY"
          cp mof_announced_supply_materialised/mof_announced_RON_primary_supply_reference_mode_pilot_Q1_2025.json "$ASSESSMENT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EVENTS" "$MONTHLY" "$ASSESSMENT"

          if git diff --cached --quiet; then
            echo "Materialised Q1 announced-supply pilot is already identical."
            exit 0
          fi

          git commit -m "data: materialise exact Q1 announced-RON supply pilot"
          git push origin HEAD:"$BRANCH"

      - name: Upload materialised pilot
        uses: actions/upload-artifact@v4
        with:
          name: mof-announced-ron-primary-supply-materialised-${{ github.sha }}
          path: mof_announced_supply_materialised/
          if-no-files-found: error
          retention-days: 90
