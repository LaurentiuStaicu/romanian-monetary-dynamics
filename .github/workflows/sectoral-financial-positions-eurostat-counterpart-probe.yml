name: Sectoral Financial Positions Eurostat Counterpart Discovery Probe

# TRIGGER-CONDITIONED HISTORICAL DISCOVERY REPLAY.
# The retained Eurostat source boundary is exhausted under the current canonical
# horizon. Manual reruns against unchanged topology are reproducibility only,
# not new scientific progress. Treat live acquisition as current work only
# after the accounting_counterpart_topology trigger is satisfied and a new
# source-topology pass is preregistered.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-eurostat-counterpart-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify frozen Eurostat discovery contract and probe logic
        run: |
          python -m unittest tests.test_sectoral_financial_positions_external_source_screening -v
          python -m unittest tests.test_sectoral_financial_positions_eurostat_counterpart_probe_contract -v
          python -m unittest tests.test_sectoral_financial_positions_eurostat_counterpart_probe -v
      - name: Probe Eurostat Romania counterpart schema and recent coverage
        env:
          EUROSTAT_COUNTERPART_PROBE_OUT: sectoral_financial_positions_eurostat_counterpart_probe_artifacts
        run: python scripts/audit_eurostat_sectoral_financial_positions_counterpart_probe.py
      - name: Upload source-access evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sectoral-financial-positions-eurostat-counterpart-probe-${{ github.sha }}
          path: sectoral_financial_positions_eurostat_counterpart_probe_artifacts/
          if-no-files-found: error
          retention-days: 90
