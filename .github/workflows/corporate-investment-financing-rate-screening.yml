name: Corporate Investment Financing Rate Source Screening

# Live provider refresh is manual-only after the frozen FAIL_BEFORE_HOLDOUT result.
# Unchanged reruns are reproduction only; reopening requires a separately preregistered cycle.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-financing-rate-source-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify preregistered source-continuity gate
        run: python -m unittest tests.test_corporate_investment_financing_rate_source_screening -v
      - name: Run source-continuity screening only
        env:
          CORPORATE_INVESTMENT_RATE_SCREENING_OUT: corporate_investment_rate_screening_artifacts
        run: python scripts/audit_corporate_investment_financing_rate_source_screening.py --allow-live-refetch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corporate-investment-financing-rate-screening-${{ github.sha }}
          path: corporate_investment_rate_screening_artifacts/
          if-no-files-found: error
          retention-days: 90
