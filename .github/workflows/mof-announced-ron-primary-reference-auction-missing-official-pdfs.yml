name: Probe Missing Ministry 2025 Official PDFs

run-name: "MoF full-2025 recovery / ${{ inputs.trigger_condition }} / ${{ inputs.evidence_reference }}"

# EVIDENCE-TRIGGERED MANUAL RECOVERY ONLY.
# The canonical recovery assessment has active_polling=false and three unresolved
# official acts. Do not dispatch against unchanged endpoints or as routine polling.
# A run must declare which frozen reopen condition is satisfied by genuinely new
# official evidence. Manual execution without such evidence is reproduction/probing,
# not scientific progress.
on:
  workflow_dispatch:
    inputs:
      trigger_condition:
        description: "Frozen reopen condition satisfied by genuinely new official evidence"
        required: true
        type: choice
        options:
          - stable_official_pdf_or_file_transport
          - portal_transport_becomes_reproducible
          - verifiable_official_raw_file_supplied
      evidence_reference:
        description: "Reference for the new official evidence (URL, PR, issue, commit, or retained artifact)"
        required: true
        type: string
      evidence_verified:
        description: "Confirm the referenced evidence is new and satisfies the selected reopen condition"
        required: true
        type: boolean
        default: false
concurrency:
  group: mof-missing-official-pdf-recovery-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    if: ${{ inputs.evidence_verified == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: recovery/mof-announced-ron-primary-reference-auction-missing-sources-2026-09-20

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install native PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Verify recovery-probe invariants
        run: |
          python -m unittest \
            tests.test_mof_announced_RON_primary_reference_auction_missing_official_pdfs -v

      - name: Probe official MF and ANAF PDF endpoints
        run: |
          python scripts/probe_mof_announced_RON_primary_reference_auction_missing_official_pdfs.py \
            --output mof_missing_source_official_pdf_probe_artifact

      - name: Upload exact probe artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mof-missing-official-pdf-probe-${{ github.sha }}
          path: mof_missing_source_official_pdf_probe_artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
