name: Probe Missing Ministry 2025 Official PDFs

on:
  push:
    branches:
      - recovery/mof-announced-ron-primary-reference-auction-missing-sources-2026-09-20
    paths:
      - .github/workflows/mof-announced-ron-primary-reference-auction-missing-official-pdfs.yml
      - scripts/probe_mof_announced_RON_primary_reference_auction_missing_official_pdfs.py
      - tests/test_mof_announced_RON_primary_reference_auction_missing_official_pdfs.py
      - model/dynamics/mof_announced_RON_primary_reference_auction_full_2025_source_vintage_contract.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Verify recovery-probe invariants
        run: |
          python -m unittest \
            tests.test_mof_announced_RON_primary_reference_auction_missing_official_pdfs -v

      - name: Probe official MF and ANAF PDF endpoints
        run: |
          python scripts/probe_mof_announced_RON_primary_reference_auction_missing_official_pdfs.py \
            --output mof_missing_source_official_pdf_probe_artifact

      - name: Upload exact probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mof-missing-official-pdf-probe-${{ github.sha }}
          path: mof_missing_source_official_pdf_probe_artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
