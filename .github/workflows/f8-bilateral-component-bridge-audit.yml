name: F8 Bilateral Component Bridge Audit

# Live provider refresh is manual-only under the terminal Accounting Spine hold.
# Unchanged reruns are reproduction only and do not satisfy a reopen trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f8-components:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify F8 component-bridge contract
        run: python -m unittest tests.test_f8_bilateral_component_bridge_contract -v

      - name: Probe bilateral F81 and F89 coverage
        env:
          F8_COMPONENT_OUT: f8_component_artifacts
        run: python scripts/audit_qsa_f8_bilateral_components.py

      - name: Upload F8 component-bridge evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f8-bilateral-component-bridge-${{ github.sha }}
          path: f8_component_artifacts/
          if-no-files-found: error
          retention-days: 30
