name: F21 F2 External Bridge Audit

# Live provider refresh is manual-only under the terminal Accounting Spine hold.
# Unchanged reruns are reproduction only and do not satisfy a reopen trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f21-external-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify F21 bridge contract
        run: python -m unittest tests.test_f21_f2_external_bridge_contract -v

      - name: Test holder-specific W1 F2 minus F2M bridge
        env:
          F21_BRIDGE_OUT: f21_bridge_artifacts
        run: python scripts/audit_qsa_f21_f2_external_bridge.py

      - name: Upload F21 bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: f21-f2-external-bridge-${{ github.sha }}
          path: f21_bridge_artifacts/
          if-no-files-found: error
          retention-days: 30
