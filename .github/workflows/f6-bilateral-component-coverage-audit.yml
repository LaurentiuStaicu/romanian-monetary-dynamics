name: F6 Bilateral Component Coverage Audit

# Live provider refresh is manual-only under the terminal Accounting Spine hold.
# Unchanged reruns are reproduction only and do not satisfy a reopen trigger.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-f6-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Check out repository
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        name: Set up Python 3.12
        with:
          python-version: "3.12"
      - name: Verify F6 component contract
        run: python -m unittest tests.test_f6_bilateral_component_coverage_contract -v
      - name: Probe bilateral F6 subcomponents
        env:
          F6_COMPONENT_OUT: f6_component_artifacts
        run: python scripts/audit_qsa_f6_bilateral_components.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload F6 component evidence
        with:
          name: f6-bilateral-components-${{ github.sha }}
          path: f6_component_artifacts/
          if-no-files-found: error
          retention-days: 30
