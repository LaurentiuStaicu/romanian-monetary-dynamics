<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" role="img" aria-labelledby="title desc">
  <title id="title">Romanian Monetary Dynamics conceptual structure</title>
  <desc id="desc">Six institutional sectors define the RMD system boundary. They are represented through an Accounting Spine covering F2 to F8 stocks, transactions and revaluations under double-entry conservation. Observed evidence and reference modes constrain the model. Candidate dynamics remain quantitatively inactive and must pass explicit activation gates. Current state: Evidence-Triggered Baseline Hold with behavioural closure inactive.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a0a0a0"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="380" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">RMD conceptual structure</text>
    <text x="380" y="68" text-anchor="middle" font-size="18" fill="#a0a0a0">Boundary → accounting → evidence → candidate dynamics → gates</text>

    <text x="60" y="108" font-size="17" font-weight="700" letter-spacing="1.2" fill="#a0a0a0">INSTITUTIONAL BOUNDARY</text>

    <g fill="#333333" stroke="#a0a0a0" stroke-width="1.5">
      <rect x="60" y="128" width="200" height="72" rx="7"/>
      <rect x="280" y="128" width="200" height="72" rx="7"/>
      <rect x="500" y="128" width="200" height="72" rx="7"/>
      <rect x="60" y="218" width="200" height="72" rx="7"/>
      <rect x="280" y="218" width="200" height="72" rx="7"/>
      <rect x="500" y="218" width="200" height="72" rx="7"/>
    </g>

    <g fill="#ffffff" text-anchor="middle">
      <text x="160" y="157" font-size="21" font-weight="700">H</text>
      <text x="160" y="183" font-size="17">Households + NPISH</text>

      <text x="380" y="157" font-size="21" font-weight="700">C</text>
      <text x="380" y="183" font-size="17">Non-financial corps.</text>

      <text x="600" y="157" font-size="21" font-weight="700">F</text>
      <text x="600" y="183" font-size="17">Financial corps.</text>

      <text x="160" y="247" font-size="21" font-weight="700">G</text>
      <text x="160" y="273" font-size="17">General government</text>

      <text x="380" y="247" font-size="21" font-weight="700">BNR</text>
      <text x="380" y="273" font-size="17">Central bank</text>

      <text x="600" y="247" font-size="21" font-weight="700">X</text>
      <text x="600" y="273" font-size="17">Rest of world</text>
    </g>

    <line x1="380" y1="303" x2="380" y2="337" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="328" font-size="16" fill="#a0a0a0">represented through</text>

    <rect x="70" y="350" width="620" height="92" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="105" y="382" font-size="23" font-weight="700" fill="#ffffff">Accounting Spine</text>
    <text x="105" y="413" font-size="18" fill="#a0a0a0">F2–F8 · stocks · transactions · revaluations</text>
    <text x="105" y="435" font-size="17" fill="#a0a0a0">double-entry conservation</text>

    <line x1="380" y1="442" x2="380" y2="478" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="468" font-size="16" fill="#a0a0a0">checked against / constrained by</text>

    <rect x="70" y="491" width="620" height="92" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="105" y="523" font-size="23" font-weight="700" fill="#ffffff">Observed evidence &amp; reference modes</text>
    <text x="105" y="554" font-size="18" fill="#a0a0a0">official / reproducible sources · retained vintages</text>
    <text x="105" y="576" font-size="17" fill="#a0a0a0">9 / 10 required reference modes ready</text>

    <line x1="380" y1="583" x2="380" y2="619" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="609" font-size="16" fill="#a0a0a0">informs; does not activate</text>

    <rect x="70" y="632" width="620" height="92" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="105" y="664" font-size="23" font-weight="700" fill="#ffffff">Candidate dynamics</text>
    <text x="105" y="695" font-size="18" fill="#a0a0a0">feedback architecture · delays · behavioural candidates</text>
    <text x="105" y="717" font-size="17" fill="#a0a0a0">0 quantitatively active feedback loops</text>

    <line x1="380" y1="724" x2="380" y2="760" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="750" font-size="16" fill="#a0a0a0">must pass before activation</text>

    <rect x="70" y="773" width="620" height="92" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="105" y="805" font-size="23" font-weight="700" fill="#ffffff">Activation gates</text>
    <text x="105" y="836" font-size="18" fill="#a0a0a0">evidence · identification · units · extreme conditions</text>
    <text x="105" y="858" font-size="17" fill="#a0a0a0">sensitivity · validation</text>

    <rect x="105" y="889" width="550" height="34" rx="17" fill="#a0a0a0"/>
    <text x="380" y="912" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">Evidence-Triggered Baseline Hold · behavioural closure inactive</text>
  </g>
</svg>
