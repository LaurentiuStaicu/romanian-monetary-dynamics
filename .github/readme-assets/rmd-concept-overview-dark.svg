<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Romanian Monetary Dynamics conceptual structure</title>
  <desc id="desc">The RMD institutional boundary contains households and NPISH, non-financial corporations, financial corporations, general government, the National Bank of Romania, and the rest of the world. These sectors are represented through an Accounting Spine covering F2 to F8 stocks, transactions and revaluations under double-entry conservation. Observed evidence and reference modes check and constrain the model. Candidate dynamics remain quantitatively inactive and must pass evidence, identification, units, extreme-condition, sensitivity and validation gates before activation. The current state is Evidence-Triggered Baseline Hold with behavioural closure inactive.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a0a0a0"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="560" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">RMD conceptual structure</text>
    <text x="560" y="68" text-anchor="middle" font-size="18" fill="#a0a0a0">Institutional boundary → accounting → evidence → candidate dynamics → activation gates</text>

    <text x="75" y="105" font-size="16" font-weight="700" letter-spacing="1.2" fill="#a0a0a0">INSTITUTIONAL BOUNDARY</text>

    <g font-size="17" fill="#ffffff">
      <rect x="75" y="125" width="150" height="70" rx="6" fill="#333333" stroke="#a0a0a0" stroke-width="1.5"/>
      <text x="150" y="153" text-anchor="middle" font-weight="700">H</text>
      <text x="150" y="177" text-anchor="middle" font-size="15">Households + NPISH</text>

      <rect x="239" y="125" width="150" height="70" rx="6" fill="#333333" stroke="#a0a0a0" stroke-width="1.5"/>
      <text x="314" y="153" text-anchor="middle" font-weight="700">C</text>
      <text x="314" y="177" text-anchor="middle" font-size="15">Non-financial corps.</text>

      <rect x="403" y="125" width="150" height="70" rx="6" fill="#333333" stroke="#a0a0a0" stroke-width="1.5"/>
      <text x="478" y="153" text-anchor="middle" font-weight="700">F</text>
      <text x="478" y="177" text-anchor="middle" font-size="15">Financial corps.</text>

      <rect x="567" y="125" width="150" height="70" rx="6" fill="#333333" stroke="#a0a0a0" stroke-width="1.5"/>
      <text x="642" y="153" text-anchor="middle" font-weight="700">G</text>
      <text x="642" y="177" text-anchor="middle" font-size="15">General government</text>

      <rect x="731" y="125" width="150" height="70" rx="6" fill="#333333" stroke="#a0a0a0" stroke-width="1.5"/>
      <text x="806" y="153" text-anchor="middle" font-weight="700">BNR</text>
      <text x="806" y="177" text-anchor="middle" font-size="15">Central bank</text>

      <rect x="895" y="125" width="150" height="70" rx="6" fill="#333333" stroke="#a0a0a0" stroke-width="1.5"/>
      <text x="970" y="153" text-anchor="middle" font-weight="700">X</text>
      <text x="970" y="177" text-anchor="middle" font-size="15">Rest of world</text>
    </g>

    <line x1="560" y1="205" x2="560" y2="238" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="578" y="228" font-size="14" fill="#a0a0a0">represented through</text>

    <rect x="110" y="250" width="900" height="74" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="145" y="279" font-size="21" font-weight="700" fill="#ffffff">Accounting Spine</text>
    <text x="145" y="305" font-size="17" fill="#a0a0a0">F2–F8 · stocks · transactions · revaluations · double-entry conservation</text>

    <line x1="560" y1="324" x2="560" y2="355" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="578" y="347" font-size="14" fill="#a0a0a0">checked against / constrained by</text>

    <rect x="110" y="368" width="900" height="74" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="145" y="397" font-size="21" font-weight="700" fill="#ffffff">Observed evidence &amp; reference modes</text>
    <text x="145" y="423" font-size="17" fill="#a0a0a0">official / reproducible sources · retained vintages · 9 / 10 required modes ready</text>

    <line x1="560" y1="442" x2="560" y2="473" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="578" y="465" font-size="14" fill="#a0a0a0">informs; does not activate</text>

    <rect x="110" y="486" width="900" height="74" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="145" y="515" font-size="21" font-weight="700" fill="#ffffff">Candidate dynamics</text>
    <text x="145" y="541" font-size="17" fill="#a0a0a0">feedback architecture · delays · behavioural candidates · 0 quantitatively active feedback loops</text>

    <line x1="560" y1="560" x2="560" y2="591" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="578" y="583" font-size="14" fill="#a0a0a0">must pass before quantitative activation</text>

    <rect x="110" y="604" width="900" height="74" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="145" y="633" font-size="21" font-weight="700" fill="#ffffff">Activation gates</text>
    <text x="145" y="659" font-size="17" fill="#a0a0a0">evidence · identification · units · extreme conditions · sensitivity · validation</text>

    <rect x="250" y="690" width="620" height="28" rx="14" fill="#a0a0a0"/>
    <text x="560" y="710" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">Current state: Evidence-Triggered Baseline Hold · behavioural closure inactive</text>
  </g>
</svg>
